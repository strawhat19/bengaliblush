kind = "web"
previewPath = "/"
title = "Bengali Blush"
description = "A mobile-first beauty boutique storefront for Bengali Blush, offering lash extensions, hair styling, party makeup, curated beauty products, and service booking for clients who want to feel beautifully seen."
version = "1.0.0"
id = "artifacts/bengali-blush"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25910

[services.development]
run = "pnpm --filter @workspace/bengali-blush run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bengali-blush", "run", "build" ]
serve = "static"
publicDir = "artifacts/bengali-blush/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25910"
BASE_PATH = "/"
